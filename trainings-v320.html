<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎓 Εκπαιδεύσεις • Nikoleta Wellness CEO</title><style>:root{--g:#087f3f;--gold:#c9a227;--ink:#17382b;--mut:#718078}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#f4f0e5,#fff,#eef8f1)}.wrap{max-width:1100px;margin:auto;padding:18px}.hero{color:white;background:linear-gradient(135deg,#075f31,#0a8c49);padding:28px;border-radius:25px}.hero h1{margin:8px 0}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:15px 0}.card,.panel,.training{background:#fff;border:1px solid #e3e8df;border-radius:18px;padding:15px;box-shadow:0 10px 25px #17452a16}.card b{display:block;font-size:25px;color:var(--g)}.card span,.meta,.note{font-size:12px;color:var(--mut)}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--g);color:#fff}.soft{background:#fff;color:var(--g);border:1px solid #d6e3da}.search{flex:1}.search input,select,input,textarea{width:100%;padding:11px;border:1px solid #d9e4dc;border-radius:11px;font:inherit}.panel{margin:15px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.full{grid-column:1/-1}.timebox{grid-column:1/-1;background:#f4faf5;border:1px solid #d7e8da;border-radius:15px;padding:14px}.timegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.trainings{display:grid;grid-template-columns:1fr 1fr;gap:13px}.training h3{margin:6px 0}.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:800;background:#e3f3e8;color:#137241}.busy{margin-top:9px;background:#fff3cf;color:#705900;padding:8px;border-radius:9px;font-size:12px;font-weight:800}.edit{background:#e8f3ed;color:var(--g)}.del{background:#fff0f0;color:#b83e3e}.open{background:#f5edc9;color:#705900}.hidden{display:none}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.grid,.timegrid,.trainings{grid-template-columns:1fr}.full{grid-column:auto}.btn{width:100%}}</style></head><body><main class="wrap"><section class="hero"><small> NIKOΛETA WELLNESS CEO</small><h1>🎓 Εκπαιδεύσεις</h1><p>Εκπαίδευση + πραγματική δέσμευση ώρας στην ατζέντα.</p></section><section class="stats"><div class="card"><b id="total">0</b><span>Σύνολο</span></div><div class="card"><b id="up">0</b><span>Επόμενες</span></div><div class="card"><b id="prog">0</b><span>Σε εξέλιξη</span></div><div class="card"><b id="done">0</b><span>Ολοκληρωμένες</span></div><div class="card"><b id="hours">0</b><span>Ώρες</span></div></section><div class="toolbar"><button class="btn primary" id="new">＋ Νέα εκπαίδευση</button><div class="search"><input id="search" placeholder="🔎 Αναζήτηση..."></div></div><section class="panel hidden" id="form"><h2 id="ft">✨ Νέα εκπαίδευση</h2><div class="grid"><div class="field"><label>Τίτλος *</label><input id="title"></div><div class="field"><label>Κατηγορία</label><select id="cat"><option>Herbalife Training</option><option>Leadership</option><option>Sales & Customers</option><option>Social Media</option><option>Wellness & Nutrition</option><option>Personal Development</option><option>Certification</option><option>Άλλο</option></select></div><div class="field"><label>Ημερομηνία</label><input type="date" id="date"></div><div class="field"><label>Ώρες εκπαίδευσης</label><input type="number" min="0" step="0.5" id="hrs"></div><div class="timebox"><b>⏰ ΔΕΣΜΕΥΣΗ ΩΡΑΣ</b><div class="timegrid"><div class="field"><label>Από ώρα</label><input type="time" id="start"></div><div class="field"><label>Μέχρι ώρα</label><input type="time" id="end"></div></div><div class="note">Οι ώρες αυτές θα θεωρούνται κατειλημμένες στην ατζέντα και θα μπλοκάρουν νέο ραντεβού.</div></div><div class="field"><label>Εκπαιδευτής / Φορέας</label><input id="trainer"></div><div class="field"><label>Τοποθεσία / Online</label><input id="loc"></div><div class="field"><label>Κατάσταση</label><select id="status"><option>Προγραμματισμένη</option><option>Σε εξέλιξη</option><option>Ολοκληρώθηκε</option><option>Αρχειοθετήθηκε</option></select></div><div class="field"><label>Πιστοποίηση</label><select id="cert"><option>Όχι</option><option>Ναι</option><option>Σε αναμονή</option></select></div><div class="field full"><label>Τι έμαθα</label><textarea id="learned"></textarea></div><div class="field full"><label>Επόμενο βήμα</label><textarea id="next"></textarea></div><div class="field full"><label>Σύνδεσμος υλικού / πιστοποίησης</label><input id="url"></div></div><div class="actions"><button class="btn primary" id="save">💾 Αποθήκευση</button><button class="btn soft" id="cancel">Ακύρωση</button></div></section><section id="list" class="trainings"></section></main><script>const K='nwceo_trainings_v320',OLD='nwceo_trainings_v319';let data=JSON.parse(localStorage.getItem(K)||'null')||JSON.parse(localStorage.getItem(OLD)||'[]').map(x=>({...x,startTime:x.startTime||'',endTime:x.endTime||''})),edit=null;localStorage.setItem(K,JSON.stringify(data));const $=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let q=$('search').value.toLowerCase(),a=data.filter(x=>JSON.stringify(x).toLowerCase().includes(q));$('total').textContent=data.length;$('up').textContent=data.filter(x=>x.status==='Προγραμματισμένη').length;$('prog').textContent=data.filter(x=>x.status==='Σε εξέλιξη').length;$('done').textContent=data.filter(x=>x.status==='Ολοκληρώθηκε').length;$('hours').textContent=data.reduce((n,x)=>n+(+x.hours||0),0);$('list').innerHTML=a.length?a.map(x=>`<article class="training"><div>🎓 <b>${E(x.title)}</b></div><div class="meta">${E(x.category)}${x.date?' · 📅 '+E(x.date):''}${x.trainer?' · '+E(x.trainer):''}${x.loc?'<br>📍 '+E(x.loc):''}</div>${x.startTime&&x.endTime?`<div class="busy">⏰ ${E(x.startTime)} – ${E(x.endTime)} · 🔒 Η ώρα είναι δεσμευμένη στην ατζέντα</div>`:''}<span class="badge">${E(x.status)}</span><div class="actions">${x.url?`<button class="btn open" onclick="window.open('${E(x.url)}','_blank')">↗ Υλικό</button>`:''}<button class="btn edit" onclick="editT('${x.id}')">✏️ Επεξεργασία</button><button class="btn del" onclick="delT('${x.id}')">🗑 Διαγραφή</button></div></article>`).join(''):'<div class="panel">📚 Δεν υπάρχουν ακόμη εκπαιδεύσεις.</div>'}function show(x){edit=x?.id||null;$('form').classList.remove('hidden');$('ft').textContent=x?'✏️ Επεξεργασία':'✨ Νέα εκπαίδευση';[['title','title'],['date','date'],['hrs','hours'],['start','startTime'],['end','endTime'],['trainer','trainer'],['loc','loc'],['learned','learned'],['next','next'],['url','url']].forEach(([a,b])=>$(a).value=x?.[b]??'');$('cat').value=x?.category||'Herbalife Training';$('status').value=x?.status||'Προγραμματισμένη';$('cert').value=x?.certificate||'Όχι';scrollTo({top:$('form').offsetTop-10,behavior:'smooth'})}function reset(){$('form').classList.add('hidden');edit=null}function saveT(){let title=$('title').value.trim(),date=$('date').value,startTime=$('start').value,endTime=$('end').value;if(!title)return alert('Γράψε τον τίτλο της εκπαίδευσης.');if((startTime&&!endTime)||(!startTime&&endTime))return alert('Βάλε και ώρα έναρξης και ώρα λήξης.');if(startTime&&endTime&&endTime<=startTime)return alert('Η ώρα λήξης πρέπει να είναι μετά την έναρξη.');if((startTime||endTime)&&!date)return alert('Για δέσμευση ώρας χρειάζεται ημερομηνία.');let x={id:edit||Date.now().toString(),title,category:$('cat').value,date,hours:+$('hrs').value||0,startTime,endTime,trainer:$('trainer').value.trim(),loc:$('loc').value.trim(),status:$('status').value,certificate:$('cert').value,learned:$('learned').value.trim(),next:$('next').value.trim(),url:$('url').value.trim()};let i=data.findIndex(z=>z.id===x.id);i<0?data.unshift(x):data[i]=x;localStorage.setItem(K,JSON.stringify(data));reset();render()}window.editT=id=>{let x=data.find(z=>z.id===id);if(x)show(x)};window.delT=id=>{if(confirm('Να διαγραφεί αυτή η εκπαίδευση;')){data=data.filter(x=>x.id!==id);localStorage.setItem(K,JSON.stringify(data));render()}};$('new').onclick=()=>show();$('cancel').onclick=reset;$('save').onclick=saveT;$('search').oninput=render;render();</script></body></html>
