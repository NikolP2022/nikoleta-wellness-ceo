<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#245b2b"><title>Follow-ups — Nikoleta Wellness CEO</title><style>body{margin:0;font-family:Georgia,'Times New Roman',serif;background:#f5efe4;color:#214b2b}*{box-sizing:border-box}.wrap{max-width:1100px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#174d2a,#2f7138);color:#fff;border-radius:28px;padding:30px;box-shadow:0 12px 35px #214b2b30}.eyebrow{letter-spacing:2px;font-size:12px;color:#e8cf91}.hero h1{margin:8px 0;font-size:34px}.hero p{margin:0;color:#f7f1e5}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:16px;padding:14px 20px;font-weight:700;cursor:pointer}.primary{background:#245b2b;color:white}.gold{background:#d7b76a;color:#173e22}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fffaf2;border:1px solid #d8c79f;border-radius:22px;padding:20px;box-shadow:0 8px 25px #493b2112}.stat{font-size:30px;font-weight:bold}.muted{color:#6d746a;font-size:13px}.list{margin-top:20px}.item{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:12px}.item .info{flex:1}.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:#e9dfc5;font-size:12px}.modal{display:none;position:fixed;inset:0;background:#16351d88;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.box{background:#fffaf2;border-radius:26px;padding:25px;width:min(680px,100%);max-height:90vh;overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}input,select,textarea{border:1px solid #d8c79f;border-radius:13px;padding:12px;background:#fff;color:#243c28;font:inherit}textarea{min-height:120px}.save{width:100%;margin-top:15px;background:#245b2b;color:white;border:0;border-radius:15px;padding:15px;font-weight:bold;font-size:16px}@media(max-width:700px){.wrap{padding:14px}.hero{padding:22px}.hero h1{font-size:27px}.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}.actions .btn{width:100%}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><div class="eyebrow">👑 CEO FOLLOW-UP SYSTEM</div><h1>🔄 Follow-ups</h1><p>Οργάνωσε επαφές, επόμενα βήματα και υπενθυμίσεις με καθαρό και premium τρόπο.</p></section><div class="actions"><button class="btn primary" id="newBtn">＋ Νέο Follow-up</button></div><section class="grid"><div class="card"><div class="muted">ΣΥΝΟΛΟ</div><div class="stat" id="total">0</div></div><div class="card"><div class="muted">ΣΗΜΕΡΑ</div><div class="stat" id="today">0</div></div><div class="card"><div class="muted">ΕΚΚΡΕΜΟΥΝ</div><div class="stat" id="pending">0</div></div></section><section class="list" id="list"></section></main><div class="modal" id="modal"><div class="box"><h2>👑 Νέο Follow-up</h2><form id="form" class="form"><input type="hidden" id="editId"><label class="field">Όνομα / Επαφή<input id="name" required></label><label class="field">Τηλέφωνο<input id="phone"></label><label class="field">Ημερομηνία<input id="date" type="date" required></label><label class="field">Ώρα<input id="time" type="time"></label><label class="field">Κατάσταση<select id="status"><option>Εκκρεμεί</option><option>Ολοκληρώθηκε</option><option>Ακυρώθηκε</option></select></label><label class="field">Τύπος<select id="type"><option>Πελάτης</option><option>Υποψήφιος Πελάτης</option><option>Συνεργάτης</option><option>Υποψήφιος Συνεργάτης</option><option>Άλλο</option></select></label><label class="field full">Σημειώσεις<textarea id="notes"></textarea></label><div class="field full"><button class="save" type="submit">💾 Αποθήκευση Follow-up</button><button type="button" class="btn" id="cancel">Ακύρωση</button></div></form></div></div><script>const key='nwceo_followups_v316';let data=JSON.parse(localStorage.getItem(key)||'[]');const $=id=>document.getElementById(id);function render(){data.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));$('total').textContent=data.length;$('today').textContent=data.filter(x=>x.date===new Date().toISOString().slice(0,10)).length;$('pending').textContent=data.filter(x=>x.status==='Εκκρεμεί').length;let l=$('list');l.innerHTML=data.length?'':'<div class="card">Δεν υπάρχουν ακόμη Follow-ups. Πάτησε <b>＋ Νέο Follow-up</b>.</div>';data.forEach(x=>{let d=document.createElement('div');d.className='card item';d.innerHTML='<div class="info"><b>'+esc(x.name)+'</b> <span class="badge">'+esc(x.status)+'</span><div class="muted">'+esc(x.type)+' · '+esc(x.date)+' '+esc(x.time||'')+'</div><div>'+esc(x.notes||'')+'</div></div><div><button class="btn gold" onclick="editItem(\''+x.id+'\')">✏️ Επεξεργασία</button> <button class="btn" onclick="deleteItem(\''+x.id+'\')">🗑️ Διαγραφή</button></div>';l.appendChild(d)})}function esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function openModal(x){$('modal').classList.add('open');$('editId').value=x?.id||'';$('name').value=x?.name||'';$('phone').value=x?.phone||'';$('date').value=x?.date||new Date().toISOString().slice(0,10);$('time').value=x?.time||'';$('status').value=x?.status||'Εκκρεμεί';$('type').value=x?.type||'Πελάτης';$('notes').value=x?.notes||''}function close(){ $('modal').classList.remove('open');$('form').reset();$('editId').value=''}$('newBtn').onclick=()=>openModal();$('cancel').onclick=close;$('form').onsubmit=e=>{e.preventDefault();let id=$('editId').value||Date.now().toString(),x={id,name:$('name').value,phone:$('phone').value,date:$('date').value,time:$('time').value,status:$('status').value,type:$('type').value,notes:$('notes').value};let i=data.findIndex(a=>a.id===id);i>=0?data[i]=x:data.push(x);localStorage.setItem(key,JSON.stringify(data));close();render()};window.editItem=id=>openModal(data.find(x=>x.id===id));window.deleteItem=id=>{if(confirm('Να διαγραφεί αυτό το Follow-up;')){data=data.filter(x=>x.id!==id);localStorage.setItem(key,JSON.stringify(data));render()}};render();</script></body></html>
