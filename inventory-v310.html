<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#245b2b"><title>📦 Αποθήκη — Nikoleta Wellness CEO</title><style>body{margin:0;background:#eef1eb;font-family:Arial,sans-serif;color:#304b37}.wrap{max-width:1120px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#1f5b2a,#477b4c);color:#fff;border-radius:30px;padding:30px;box-shadow:0 18px 45px #245b2b35}.hero small{letter-spacing:2px}.hero h1{font-size:38px;margin:12px 0 6px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.box,.bar,.card{background:#fffdf8;border:1px solid #e6ddc8;border-radius:22px;box-shadow:0 8px 25px #0000000a}.stats .box{padding:18px}.stats b{display:block;color:#245b2b;font-size:25px;margin:6px 0}.bar{padding:20px;display:flex;justify-content:space-between;align-items:center}.bar h2{margin:0;color:#245b2b}.bar p{margin:5px 0;color:#78827a}.btn{border:0;background:#245b2b;color:#fff;border-radius:14px;padding:14px 20px;font-weight:800;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.filters{display:grid;grid-template-columns:1fr 240px;gap:12px;margin:14px 0}.filters input,.filters select,input,textarea{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d8d0bb;border-radius:13px;background:#fffefa;font:inherit}.card{padding:19px;margin:12px 0}.top{display:flex;justify-content:space-between;gap:12px}.name{font-size:21px;font-weight:800;color:#245b2b}.badge{padding:7px 11px;border-radius:99px;background:#eaf3e9;color:#245b2b;font-size:12px;font-weight:800;white-space:nowrap}.low{background:#fff0dc;color:#9a5a00}.details{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:15px 0}.detail{background:#f6f3eb;border-radius:13px;padding:10px}.detail small{display:block;color:#78827a}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:1px solid #d8d0bb;background:#fff;border-radius:11px;padding:9px 13px;font-weight:700;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.modal{position:fixed;z-index:9999;inset:0;background:#17251b99;display:flex;align-items:center;justify-content:center;padding:18px;box-sizing:border-box}.form{width:min(780px,100%);max-height:92vh;overflow:auto;background:#fffdf8;border-radius:28px;-webkit-overflow-scrolling:touch}.head{background:linear-gradient(135deg,#245b2b,#477b4c);color:#fff;padding:22px;display:flex;justify-content:space-between;align-items:flex-start}.head button{background:#ffffff22;border:0;color:#fff;font-size:28px;width:42px;height:42px;border-radius:50%;cursor:pointer;touch-action:manipulation}.body{padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:7px}.field textarea{min-height:120px;resize:vertical}.full{grid-column:1/-1}.foot{padding:0 22px 22px;display:flex;justify-content:flex-end;gap:10px}.foot button{min-height:48px}.saved{position:fixed;z-index:10000;left:20px;right:20px;bottom:20px;background:#245b2b;color:#fff;padding:13px 18px;border-radius:14px;font-weight:800;text-align:center;box-shadow:0 10px 30px #0003}@media(max-width:760px){.wrap{padding:14px}.hero{padding:22px;border-radius:24px}.hero h1{font-size:30px}.stats{grid-template-columns:1fr 1fr}.bar{display:block}.bar .btn{width:100%;margin-top:14px;min-height:52px}.filters,.grid{grid-template-columns:1fr}.details{grid-template-columns:1fr 1fr}.full{grid-column:auto}.foot{flex-direction:column}.foot button{width:100%;min-height:52px}.modal{align-items:flex-start;padding:10px}.form{max-height:calc(100dvh - 20px);margin-top:0}.head{padding:18px}.body{padding:18px}.field input,.field textarea{font-size:16px}}</style></head><body><div class="wrap"><section class="hero"><small>👑 CEO BUSINESS • PRODUCT CARE</small><h1>📦 Αποθήκη</h1><p>Οργάνωσε τα προϊόντα σου και παρακολούθησε το απόθεμα.</p></section><div id="root"></div></div><script>
(function(){
'use strict';
const KEY='nwceo_inventory';
let data=[];
try{data=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(data))data=[];}catch(e){data=[];}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const persist=()=>localStorage.setItem(KEY,JSON.stringify(data));
const root=document.getElementById('root');
let editingIndex=null;
function render(){root.innerHTML=`<section class="stats"><div class="box">📦<b>${data.length}</b>Προϊόντα</div><div class="box">🔢<b>${data.reduce((n,x)=>n+(Number(x.q)||0),0)}</b>Τεμάχια</div><div class="box">⚠️<b>${data.filter(x=>(Number(x.q)||0)<=(Number(x.m)||0)).length}</b>Χαμηλό απόθεμα</div><div class="box">💰<b>${data.reduce((n,x)=>n+(Number(x.q)||0)*(Number(x.c)||0),0).toFixed(2)} €</b>Αξία αποθέματος</div></section><section class="bar"><div><h2>Το απόθεμά μου</h2><p>Πλήρης εικόνα για κάθε προϊόν.</p></div><button id="newProduct" class="btn" type="button">＋ Νέο προϊόν</button></section><section class="filters"><input id="search" type="search" placeholder="🔎 Αναζήτηση προϊόντος, κατηγορίας ή προμηθευτή"><select id="filter"><option value="all">Όλα τα προϊόντα</option><option value="low">⚠️ Χαμηλό απόθεμα</option><option value="ok">✓ Διαθέσιμα</option></select></section><section id="items"></section>`;
 document.getElementById('newProduct').addEventListener('click',()=>openForm(null));
 document.getElementById('search').addEventListener('input',renderList);
 document.getElementById('filter').addEventListener('change',renderList);
 renderList();
}
function renderList(){const q=(document.getElementById('search')?.value||'').toLowerCase(),f=document.getElementById('filter')?.value||'all';let rows=data.map((x,i)=>({...x,_i:i})).filter(x=>`${x.n} ${x.cat} ${x.sup}`.toLowerCase().includes(q));if(f==='low')rows=rows.filter(x=>(Number(x.q)||0)<=(Number(x.m)||0));if(f==='ok')rows=rows.filter(x=>(Number(x.q)||0)>(Number(x.m)||0));const items=document.getElementById('items');items.innerHTML=rows.length?rows.map(x=>{const low=(Number(x.q)||0)<=(Number(x.m)||0);return `<article class="card"><div class="top"><div><div class="name">${esc(x.n)}</div><div>${esc(x.cat||'Χωρίς κατηγορία')}${x.sup?' • '+esc(x.sup):''}</div></div><span class="badge ${low?'low':''}">${low?'⚠️ Χαμηλό απόθεμα':'✓ Διαθέσιμο'}</span></div><div class="details"><div class="detail"><small>Τεμάχια</small><b>${Number(x.q)||0}</b></div><div class="detail"><small>Ελάχιστο</small><b>${Number(x.m)||0}</b></div><div class="detail"><small>Κόστος</small><b>${(Number(x.c)||0).toFixed(2)} €</b></div><div class="detail"><small>Τιμή πώλησης</small><b>${(Number(x.p)||0).toFixed(2)} €</b></div><div class="detail"><small>Λήξη</small><b>${esc(x.ex||'—')}</b></div></div><div class="actions"><button type="button" data-action="minus" data-i="${x._i}">− 1</button><button type="button" data-action="plus" data-i="${x._i}">＋ 1</button><button type="button" data-action="edit" data-i="${x._i}">✏️ Επεξεργασία</button><button type="button" data-action="delete" data-i="${x._i}">🗑️ Διαγραφή</button></div></article>`}).join(''):`<div class="card" style="text-align:center;padding:45px">📦 Δεν υπάρχουν προϊόντα ακόμη.</div>`;items.querySelectorAll('button[data-action]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.i),a=b.dataset.action;if(a==='minus'){data[i].q=Math.max(0,(Number(data[i].q)||0)-1);persist();render()}else if(a==='plus'){data[i].q=(Number(data[i].q)||0)+1;persist();render()}else if(a==='edit')openForm(i);else if(a==='delete'&&confirm('Να διαγραφεί το προϊόν;')){data.splice(i,1);persist();render()}}));}
function openForm(index){if(document.querySelector('.modal'))return;editingIndex=index;const x=index===null?{}:data[index];const modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class="form"><div class="head"><div><small>PRODUCT CARE • CEO BUSINESS</small><h2>${index===null?'📦 Νέο προϊόν':'✏️ Επεξεργασία προϊόντος'}</h2></div><button id="closeForm" type="button" aria-label="Κλείσιμο">×</button></div><form id="productForm" novalidate><div class="body"><div class="grid"><div class="field"><label>📦 Προϊόν *</label><input name="n" required autocomplete="off" value="${esc(x.n)}" placeholder="π.χ. Formula 1"></div><div class="field"><label>🏷️ Κατηγορία</label><input name="cat" value="${esc(x.cat)}" placeholder="π.χ. Ροφήματα"></div><div class="field"><label>🔢 Ποσότητα *</label><input name="q" type="number" min="0" required value="${x.q??0}"></div><div class="field"><label>⚠️ Ελάχιστο απόθεμα</label><input name="m" type="number" min="0" value="${x.m??3}"></div><div class="field"><label>💰 Κόστος αγοράς (€)</label><input name="c" type="number" step="0.01" inputmode="decimal" value="${x.c??0}"></div><div class="field"><label>🏷️ Τιμή πώλησης (€)</label><input name="p" type="number" step="0.01" inputmode="decimal" value="${x.p??0}"></div><div class="field"><label>🚚 Προμηθευτής</label><input name="sup" value="${esc(x.sup)}"></div><div class="field"><label>📅 Ημερομηνία λήξης</label><input name="ex" type="date" value="${esc(x.ex)}"></div><div class="field"><label>📍 Θέση αποθήκευσης</label><input name="loc" value="${esc(x.loc)}"></div><div class="field full"><label>📝 Σημειώσεις</label><textarea name="note">${esc(x.note)}</textarea></div></div></div><div class="foot"><button id="cancelForm" type="button">Ακύρωση</button><button class="btn" type="submit">💾 Αποθήκευση προϊόντος</button></div></form></div>`;document.body.appendChild(modal);document.getElementById('closeForm').addEventListener('click',closeForm);document.getElementById('cancelForm').addEventListener('click',closeForm);document.getElementById('productForm').addEventListener('submit',saveForm);requestAnimationFrame(()=>modal.querySelector('input[name="n"]').focus());}
function closeForm(){const modal=document.querySelector('.modal');if(modal)modal.remove();editingIndex=null;}
function saveForm(e){e.preventDefault();const form=e.currentTarget;const val=n=>(form.elements[n]?.value||'').trim();if(!val('n')){form.elements.n.focus();return}const obj={n:val('n'),cat:val('cat'),q:Math.max(0,Number(val('q'))||0),m:Math.max(0,Number(val('m'))||0),c:Number(val('c'))||0,p:Number(val('p'))||0,sup:val('sup'),ex:val('ex'),loc:val('loc'),note:val('note')};if(editingIndex===null)data.unshift(obj);else data[editingIndex]=obj;persist();closeForm();render();const t=document.createElement('div');t.className='saved';t.textContent='✓ Η αποθήκευση ολοκληρώθηκε';document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
render();
})();
</script></body></html>
