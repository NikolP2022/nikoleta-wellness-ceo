<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>📄 Έγγραφα • Nikoleta Wellness CEO</title>
<style>
:root{--g:#087f3f;--g2:#0b9a52;--cream:#f8f5ed;--gold:#c9a227;--ink:#18352a;--muted:#6f7d76;--white:#fff;--red:#b94141;--shadow:0 12px 35px rgba(20,60,40,.10)}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#f5f1e7,#fff 45%,#edf7f0);color:var(--ink)}button,input,select,textarea{font:inherit}.wrap{max-width:1180px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#075f31,#0a8b48);color:white;border-radius:28px;padding:28px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:'✦';position:absolute;right:28px;top:8px;font-size:100px;color:rgba(255,255,255,.08)}.eyebrow{letter-spacing:2px;font-size:12px;font-weight:800;color:#e7d58a}.hero h1{margin:8px 0 4px;font-size:34px}.hero p{margin:0;opacity:.88}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.stat,.panel,.doc{background:rgba(255,255,255,.94);border:1px solid rgba(201,162,39,.18);border-radius:20px;box-shadow:var(--shadow)}.stat{padding:18px}.stat b{display:block;font-size:27px;color:var(--g)}.stat span{font-size:13px;color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.btn{border:0;border-radius:13px;padding:12px 17px;cursor:pointer;font-weight:800}.primary{background:var(--g);color:white}.gold{background:#f3e5aa;color:#654f00}.soft{background:white;color:var(--g);border:1px solid #dce9e1}.search{flex:1;min-width:210px}.search input,.toolbar select{width:100%;padding:12px;border:1px solid #dce5df;border-radius:13px;background:white}.panel{padding:22px;margin-bottom:18px}.panel h2{margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #dbe5df;border-radius:12px;background:#fff;outline:none}.field textarea{min-height:85px;resize:vertical}.full{grid-column:1/-1}.hidden{display:none}.docs{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.doc{padding:19px}.doc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.icon{font-size:30px}.doc h3{margin:4px 0 5px}.meta{font-size:13px;color:var(--muted);line-height:1.65}.badge{display:inline-block;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:900;margin-top:9px}.valid{background:#dff4e8;color:#137341}.soon{background:#fff0c2;color:#856400}.expired{background:#ffe0e0;color:#9b2f2f}.pending{background:#e8edf0;color:#53636b}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.actions button{padding:8px 11px;border-radius:10px;border:0;cursor:pointer;font-weight:800}.edit{background:#e9f3ed;color:var(--g)}.del{background:#fff0f0;color:var(--red)}.open{background:#f6efcf;color:#705900}.empty{text-align:center;padding:35px;color:var(--muted)}.note{font-size:12px;color:var(--muted);margin-top:10px}.danger{color:var(--red);font-weight:800}@media(max-width:760px){.wrap{padding:13px}.hero{border-radius:22px;padding:22px}.hero h1{font-size:27px}.stats{grid-template-columns:repeat(2,1fr)}.grid,.docs{grid-template-columns:1fr}.full{grid-column:auto}.toolbar{align-items:stretch}.search{min-width:100%}.btn{width:100%}.toolbar select{width:100%}}
</style></head>
<body><main class="wrap">
<section class="hero"><div class="eyebrow">NIKOΛETA WELLNESS CEO</div><h1>📄 Έγγραφα</h1><p>Το premium αρχείο της επιχείρησής σου — οργανωμένο, εύκολο στην αναζήτηση και με ημερομηνίες λήξης.</p></section>
<section class="stats"><div class="stat"><b id="total">0</b><span>Σύνολο εγγράφων</span></div><div class="stat"><b id="valid">0</b><span>Ενεργά</span></div><div class="stat"><b id="soon">0</b><span>Λήγουν σύντομα</span></div><div class="stat"><b id="expired">0</b><span>Ληγμένα</span></div></section>
<div class="toolbar"><button class="btn primary" id="newBtn">＋ Νέο έγγραφο</button><div class="search"><input id="search" placeholder="🔎 Αναζήτηση τίτλου, κατηγορίας, εκδότη..."></div><select id="filter"><option value="all">Όλες οι κατηγορίες</option><option>Συμβάσεις & Συμφωνίες</option><option>Οικονομικά</option><option>Εκπαίδευση</option><option>Πιστοποιήσεις</option><option>Εταιρικά</option><option>Πελάτες</option><option>Συνεργάτες</option><option>Ταξίδια</option><option>Άλλο</option></select></div>
<section class="panel hidden" id="formPanel"><h2 id="formTitle">✨ Νέο έγγραφο</h2><div class="grid"><div class="field"><label>Τίτλος εγγράφου *</label><input id="title"></div><div class="field"><label>Κατηγορία</label><select id="category"><option>Συμβάσεις & Συμφωνίες</option><option>Οικονομικά</option><option>Εκπαίδευση</option><option>Πιστοποιήσεις</option><option>Εταιρικά</option><option>Πελάτες</option><option>Συνεργάτες</option><option>Ταξίδια</option><option>Άλλο</option></select></div><div class="field"><label>Ημερομηνία εγγράφου</label><input type="date" id="date"></div><div class="field"><label>Ημερομηνία λήξης / ανανέωσης</label><input type="date" id="expiry"></div><div class="field"><label>Εκδότης / Φορέας</label><input id="issuer"></div><div class="field"><label>Αριθμός / Κωδικός εγγράφου</label><input id="ref"></div><div class="field"><label>Κατάσταση</label><select id="status"><option>Ενεργό</option><option>Σε ανανέωση</option><option>Εκκρεμεί</option><option>Αρχειοθετημένο</option></select></div><div class="field"><label>Σύνδεσμος αρχείου (προαιρετικό)</label><input id="url" placeholder="https://... ή σύνδεσμος Drive"></div><div class="field full"><label>Σημειώσεις</label><textarea id="notes" placeholder="Γράψε εδώ ό,τι θέλεις να θυμάσαι..."></textarea></div></div><div class="actions"><button class="btn primary" id="saveBtn">💾 Αποθήκευση εγγράφου</button><button class="btn soft" id="cancelBtn">Ακύρωση</button></div><div class="note">Οι ημερομηνίες λήξης χρησιμοποιούνται για την ένδειξη «Λήγει σύντομα» και «Ληγμένο».</div></section>
<section id="docs" class="docs"></section>
</main>
<script>
const KEY='nwceo_documents_v317';let docs=JSON.parse(localStorage.getItem(KEY)||'[]');let editId=null;
const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function statusOf(d){if(!d.expiry)return d.status||'Ενεργό';let t=new Date();t.setHours(0,0,0,0);let e=new Date(d.expiry+'T00:00:00');let days=Math.ceil((e-t)/86400000);if(days<0)return 'Ληγμένο';if(days<=60)return 'Λήγει σύντομα';return d.status||'Ενεργό'}
function cls(s){return s==='Ληγμένο'?'expired':s==='Λήγει σύντομα'?'soon':s==='Ενεργό'?'valid':'pending'}
function render(){let q=$('search').value.toLowerCase();let f=$('filter').value;let now=docs.map(d=>({...d,computed:statusOf(d)}));$('total').textContent=docs.length;$('valid').textContent=now.filter(d=>d.computed==='Ενεργό').length;$('soon').textContent=now.filter(d=>d.computed==='Λήγει σύντομα').length;$('expired').textContent=now.filter(d=>d.computed==='Ληγμένο').length;let list=now.filter(d=>(f==='all'||d.category===f)&&JSON.stringify(d).toLowerCase().includes(q));$('docs').innerHTML=list.length?list.map(d=>`<article class="doc"><div class="doc-top"><div><div class="icon">📄</div><h3>${esc(d.title)}</h3><div class="meta">${esc(d.category)}${d.issuer?' · '+esc(d.issuer):''}<br>${d.date?'📅 '+d.date:''}${d.expiry?' · ⏳ '+d.expiry:''}${d.ref?'<br>🔖 '+esc(d.ref):''}</div><span class="badge ${cls(d.computed)}">${esc(d.computed)}</span></div></div>${d.notes?`<div class="meta" style="margin-top:10px">📝 ${esc(d.notes)}</div>`:''}<div class="actions">${d.url?`<button class="open" onclick="window.open('${esc(d.url)}','_blank')">↗ Άνοιγμα αρχείου</button>`:''}<button class="edit" onclick="editDoc('${d.id}')">✏️ Επεξεργασία</button><button class="del" onclick="deleteDoc('${d.id}')">🗑 Διαγραφή</button></div></article>`).join(''):'<div class="panel empty">📂 Δεν υπάρχουν ακόμη έγγραφα.<br><br><button class="btn primary" onclick="showForm()">＋ Πρόσθεσε το πρώτο σου έγγραφο</button></div>'}
function showForm(d=null){editId=d?.id||null;$('formPanel').classList.remove('hidden');$('formTitle').textContent=d?'✏️ Επεξεργασία εγγράφου':'✨ Νέο έγγραφο';$('title').value=d?.title||'';$('category').value=d?.category||'Συμβάσεις & Συμφωνίες';$('date').value=d?.date||'';$('expiry').value=d?.expiry||'';$('issuer').value=d?.issuer||'';$('ref').value=d?.ref||'';$('status').value=d?.status||'Ενεργό';$('url').value=d?.url||'';$('notes').value=d?.notes||'';window.scrollTo({top:$('formPanel').offsetTop-15,behavior:'smooth'})}
function reset(){editId=null;$('formPanel').classList.add('hidden');['title','date','expiry','issuer','ref','url','notes'].forEach(id=>$(id).value='');$('status').value='Ενεργό'}
function save(){let title=$('title').value.trim();if(!title){alert('Γράψε πρώτα τον τίτλο του εγγράφου.');return}let d={id:editId||Date.now().toString(),title,category:$('category').value,date:$('date').value,expiry:$('expiry').value,issuer:$('issuer').value.trim(),ref:$('ref').value.trim(),status:$('status').value,url:$('url').value.trim(),notes:$('notes').value.trim()};let i=docs.findIndex(x=>x.id===d.id);i>=0?docs[i]=d:docs.unshift(d);localStorage.setItem(KEY,JSON.stringify(docs));reset();render()}
window.editDoc=id=>{let d=docs.find(x=>x.id===id);if(d)showForm(d)};window.deleteDoc=id=>{let d=docs.find(x=>x.id===id);if(d&&confirm('Να διαγραφεί αυτό το έγγραφο;')){docs=docs.filter(x=>x.id!==id);localStorage.setItem(KEY,JSON.stringify(docs));render()}};window.showForm=showForm;
$('newBtn').onclick=()=>showForm();$('cancelBtn').onclick=reset;$('saveBtn').onclick=save;$('search').oninput=render;$('filter').onchange=render;render();
</script></body></html>
