<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wellness CEO — Recovery</title></head><body style="font-family:Arial,sans-serif;padding:30px;text-align:center;color:#245b2b"><h2>Wellness CEO</h2><p id="m">Γίνεται διόρθωση της εφαρμογής…</p><script>(async()=>{try{const rs=await navigator.serviceWorker?.getRegistrations?.()||[];await Promise.all(rs.map(r=>r.unregister()));const ks=await caches?.keys?.()||[];await Promise.all(ks.map(k=>caches.delete(k)));document.getElementById('m').textContent='Έτοιμο. Ανοίγω την εφαρμογή…';setTimeout(()=>location.replace('./index.html?recovery='+Date.now()),300)}catch(e){document.getElementById('m').textContent='Πάτησε ξανά τον σύνδεσμο για να ανοίξει η εφαρμογή.'}})();</script></body></html>
