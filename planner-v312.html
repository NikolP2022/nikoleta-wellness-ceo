<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#245b2b"><title>📔 Planner — Nikoleta Wellness CEO</title><style>:root{--g:#245b2b;--g2:#3f7446;--cream:#f8f3e8;--gold:#c9a44c;--ink:#233126}*{box-sizing:border-box}body{margin:0;font-family:Georgia,'Times New Roman',serif;background:linear-gradient(135deg,#f8f3e8,#eef4ec);color:var(--ink)}.wrap{max-width:1050px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,var(--g),#173d20);color:white;border-radius:28px;padding:32px;box-shadow:0 18px 45px #183d2025;border:1px solid #c9a44c80}.eyebrow{letter-spacing:3px;color:#e7d39a;font-size:12px}.hero h1{font-size:38px;margin:10px 0 4px}.hero p{margin:0;color:#e9eee8}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}.card{background:#fffdf8;border:1px solid #c9a44c66;border-radius:22px;padding:20px;box-shadow:0 10px 25px #245b2b12}.card h3{margin:0 0 8px;color:var(--g)}.planner{background:#fffdf8;border-radius:28px;border:1px solid #c9a44c88;padding:26px;box-shadow:0 16px 40px #245b2b16}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field label{display:block;font-weight:bold;color:var(--g);margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:13px;border:1px solid #c9a44c66;border-radius:14px;background:#fbf8f0;font:inherit;color:var(--ink)}textarea{min-height:110px;resize:vertical}.actions{display:flex;gap:12px;margin-top:20px}.btn{border:0;border-radius:14px;padding:14px 20px;font-weight:bold;cursor:pointer}.save{background:var(--g);color:white}.clear{background:#eee7d7;color:var(--ink)}#saved{margin-top:18px}.item{padding:15px;border:1px solid #d8c78e;border-radius:16px;background:#fff;margin-top:10px;display:flex;justify-content:space-between;gap:10px}.item button{border:0;background:transparent;color:var(--g);font-weight:bold;cursor:pointer}@media(max-width:700px){.wrap{padding:14px}.hero{padding:24px}.hero h1{font-size:30px}.cards{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.actions{flex-direction:column}.btn{width:100%}.planner{padding:18px}}</style></head><body><main class="wrap"><section class="hero"><div class="eyebrow">👑 NIKOleta WELLNESS CEO</div><h1>📔 Planner</h1><p>Οργάνωσε την ημέρα, τις προτεραιότητες και την ανάπτυξη της επιχείρησής σου.</p></section><section class="cards"><div class="card"><h3>🎯 Στόχοι ημέρας</h3><div>Οργάνωση • Προτεραιότητες • Δράση</div></div><div class="card"><h3>📅 Ραντεβού</h3><div>Κράτησε τη μέρα σου οργανωμένη.</div></div><div class="card"><h3>✨ CEO Focus</h3><div>Το σημαντικότερο βήμα της ημέρας.</div></div></section><section class="planner"><h2>🌿 Σημερινή σελίδα</h2><div class="grid"><div class="field"><label>📅 Ημερομηνία</label><input id="date" type="date"></div><div class="field"><label>🎯 Κύριος στόχος</label><input id="goal" placeholder="Ο σημαντικότερος στόχος μου σήμερα..."></div><div class="field"><label>⭐ MY TOP 3</label><textarea id="top3" placeholder="1.&#10;2.&#10;3."></textarea></div><div class="field"><label>📝 Σημειώσεις</label><textarea id="notes" placeholder="Ιδέες, σκέψεις, υπενθυμίσεις..."></textarea></div></div><div class="actions"><button class="btn save" id="save">💾 Αποθήκευση ημέρας</button><button class="btn clear" id="clear">Καθαρισμός</button></div><div id="saved"></div></section></main><script>const k='nwc_planner_days';const $=id=>document.getElementById(id);function load(){let a=JSON.parse(localStorage.getItem(k)||'[]');$('saved').innerHTML=a.map((x,i)=>`<div class="item"><div><b>${x.date||'Χωρίς ημερομηνία'}</b><br>${x.goal||''}</div><button onclick="edit(${i})">✏️ Επεξεργασία</button></div>`).join('')}function edit(i){let a=JSON.parse(localStorage.getItem(k)||'[]'),x=a[i];$('date').value=x.date||'';$('goal').value=x.goal||'';$('top3').value=x.top3||'';$('notes').value=x.notes||'';$('save').dataset.edit=i;scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}$('save').onclick=()=>{let a=JSON.parse(localStorage.getItem(k)||'[]'),x={date:$('date').value,goal:$('goal').value,top3:$('top3').value,notes:$('notes').value},i=$('save').dataset.edit;if(i!==undefined){a[i]=x;delete $('save').dataset.edit}else a.unshift(x);localStorage.setItem(k,JSON.stringify(a));load();alert('Η ημέρα αποθηκεύτηκε!')};$('clear').onclick=()=>{['date','goal','top3','notes'].forEach(id=>$(id).value='');delete $('save').dataset.edit};load();</script></body></html>
