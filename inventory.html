<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>📦 Αποθήκη — Nikoleta Wellness CEO</title><style>body{margin:0;background:#eef1eb;font-family:Arial,sans-serif;color:#304b37}.wrap{max-width:1120px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#1f5b2a,#477b4c);color:#fff;border-radius:30px;padding:30px;box-shadow:0 18px 45px #245b2b35}.hero small{letter-spacing:2px}.hero h1{font-size:38px;margin:12px 0 6px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.box,.bar,.card{background:#fffdf8;border:1px solid #e6ddc8;border-radius:22px;box-shadow:0 8px 25px #0000000a}.stats .box{padding:18px}.stats b{display:block;color:#245b2b;font-size:25px;margin:6px 0}.bar{padding:20px;display:flex;justify-content:space-between;align-items:center}.bar h2{margin:0;color:#245b2b}.bar p{margin:5px 0;color:#78827a}.btn{border:0;background:#245b2b;color:#fff;border-radius:14px;padding:14px 20px;font-weight:800;cursor:pointer}.filters{display:grid;grid-template-columns:1fr 240px;gap:12px;margin:14px 0}.filters input,.filters select,input,textarea{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d8d0bb;border-radius:13px;background:#fffefa;font:inherit}.card{padding:19px;margin:12px 0}.top{display:flex;justify-content:space-between}.name{font-size:21px;font-weight:800;color:#245b2b}.badge{padding:7px 11px;border-radius:99px;background:#eaf3e9;color:#245b2b;font-size:12px;font-weight:800}.low{background:#fff0dc;color:#9a5a00}.details{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:15px 0}.detail{background:#f6f3eb;border-radius:13px;padding:10px}.detail small{display:block;color:#78827a}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:1px solid #d8d0bb;background:#fff;border-radius:11px;padding:9px 13px;font-weight:700;cursor:pointer}.modal{position:fixed;inset:0;background:#17251b99;display:flex;align-items:center;justify-content:center;padding:18px}.form{width:min(780px,100%);max-height:92vh;overflow:auto;background:#fffdf8;border-radius:28px}.head{background:linear-gradient(135deg,#245b2b,#477b4c);color:#fff;padding:22px;display:flex;justify-content:space-between}.head button{background:#ffffff22;border:0;color:#fff;font-size:28px;width:42px;height:42px;border-radius:50%}.body{padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:7px}.field textarea{min-height:120px}.full{grid-column:1/-1}.foot{padding:0 22px 22px;display:flex;justify-content:flex-end;gap:10px}.saved{position:fixed;right:20px;bottom:20px;background:#245b2b;color:#fff;padding:13px 18px;border-radius:14px;font-weight:800}@media(max-width:760px){.wrap{padding:14px}.stats{grid-template-columns:1fr 1fr}.bar{display:block}.bar .btn{width:100%;margin-top:14px}.filters,.grid{grid-template-columns:1fr}.details{grid-template-columns:1fr 1fr}.full{grid-column:auto}.foot{flex-direction:column}.foot button{width:100%}}</style></head><body><div class="wrap"><section class="hero"><small>👑 CEO BUSINESS • PRODUCT CARE</small><h1>📦 Αποθήκη</h1><p>Οργάνωσε τα προϊόντα σου και παρακολούθησε το απόθεμα.</p></section><div id="root"></div></div><script>const K='nwceo_inventory';let d=JSON.parse(localStorage.getItem(K)||'[]');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(K,JSON.stringify(d));function app(){root.innerHTML=`<section class="stats"><div class="box">📦<b>${d.length}</b>Προϊόντα</div><div class="box">🔢<b>${d.reduce((n,x)=>n+(+x.q||0),0)}</b>Τεμάχια</div><div class="box">⚠️<b>${d.filter(x=>x.q<=x.m).length}</b>Χαμηλό απόθεμα</div><div class="box">💰<b>${d.reduce((n,x)=>n+x.q*x.c,0).toFixed(2)} €</b>Αξία αποθέματος</div></section><section class="bar"><div><h2>Το απόθεμά μου</h2><p>Πλήρης εικόνα για κάθε προϊόν.</p></div><button class="btn" onclick="form()">＋ Νέο προϊόν</button></section><section class="filters"><input id="search" placeholder="🔎 Αναζήτηση προϊόντος, κατηγορίας ή προμηθευτή" oninput="list()"><select id="filter" onchange="list()"><option value="all">Όλα τα προϊόντα</option><option value="low">⚠️ Χαμηλό απόθεμα</option><option value="ok">✓ Διαθέσιμα</option></select></section><section id="items"></section>`;list()}function list(){let q=(document.getElementById('search')?.value||'').toLowerCase(),f=document.getElementById('filter')?.value||'all',z=d.filter(x=>`${x.n} ${x.cat} ${x.sup}`.toLowerCase().includes(q));if(f==='low')z=z.filter(x=>x.q<=x.m);if(f==='ok')z=z.filter(x=>x.q>x.m);items.innerHTML=z.length?z.map((x,i)=>`<article class="card"><div class="top"><div><div class="name">${esc(x.n)}</div><div>${esc(x.cat||'Χωρίς κατηγορία')}${x.sup?' • '+esc(x.sup):''}</div></div><span class="badge ${x.q<=x.m?'low':''}">${x.q<=x.m?'⚠️ Χαμηλό απόθεμα':'✓ Διαθέσιμο'}</span></div><div class="details"><div class="detail"><small>Τεμάχια</small><b>${x.q}</b></div><div class="detail"><small>Ελάχιστο</small><b>${x.m}</b></div><div class="detail"><small>Κόστος</small><b>${x.c.toFixed(2)} €</b></div><div class="detail"><small>Τιμή πώλησης</small><b>${x.p.toFixed(2)} €</b></div><div class="detail"><small>Λήξη</small><b>${x.ex||'—'}</b></div></div><div class="actions"><button onclick="qty(${i},-1)">− 1</button><button onclick="qty(${i},1)">＋ 1</button><button onclick="form(${i})">✏️ Επεξεργασία</button><button onclick="del(${i})">🗑️ Διαγραφή</button></div></article>`).join(''):`<div class="card" style="text-align:center;padding:45px">📦 Δεν υπάρχουν προϊόντα ακόμη.</div>`}function form(i=null){let x=i===null?{}:d[i],m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="form"><div class="head"><div><small>PRODUCT CARE • CEO BUSINESS</small><h2>${i===null?'📦 Νέο προϊόν':'✏️ Επεξεργασία προϊόντος'}</h2></div><button onclick="this.closest('.modal').remove()">×</button></div><form id="f"><div class="body"><div class="grid"><div class="field"><label>📦 Προϊόν *</label><input name="n" required value="${esc(x.n)}" placeholder="π.χ. Formula 1"></div><div class="field"><label>🏷️ Κατηγορία</label><input name="cat" value="${esc(x.cat)}" placeholder="π.χ. Ροφήματα"></div><div class="field"><label>🔢 Ποσότητα *</label><input name="q" type="number" min="0" required value="${x.q??0}"></div><div class="field"><label>⚠️ Ελάχιστο απόθεμα</label><input name="m" type="number" min="0" value="${x.m??3}"></div><div class="field"><label>💰 Κόστος αγοράς (€)</label><input name="c" type="number" step="0.01" value="${x.c??0}"></div><div class="field"><label>🏷️ Τιμή πώλησης (€)</label><input name="p" type="number" step="0.01" value="${x.p??0}"></div><div class="field"><label>🚚 Προμηθευτής</label><input name="sup" value="${esc(x.sup)}"></div><div class="field"><label>📅 Ημερομηνία λήξης</label><input name="ex" type="date" value="${esc(x.ex)}"></div><div class="field"><label>📍 Θέση αποθήκευσης</label><input name="loc" value="${esc(x.loc)}"></div><div class="field full"><label>📝 Σημειώσεις</label><textarea name="note">${esc(x.note)}</textarea></div></div></div><div class="foot"><button type="button" onclick="this.closest('.modal').remove()">Ακύρωση</button><button class="btn" type="submit">💾 Αποθήκευση προϊόντος</button></div></form></div>`;document.body.appendChild(m);m.querySelector('#f').onsubmit=e=>{e.preventDefault();let g=n=>e.currentTarget.elements[n].value.trim();let o={n:g('n'),cat:g('cat'),q:+g('q')||0,m:+g('m')||0,c:+g('c')||0,p:+g('p')||0,sup:g('sup'),ex:g('ex'),loc:g('loc'),note:g('note')};if(i===null)d.unshift(o);else d[i]=o;save();m.remove();app();let t=document.createElement('div');t.className='saved';t.textContent='✓ Η αποθήκευση ολοκληρώθηκε';document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}}function qty(i,v){d[i].q=Math.max(0,d[i].q+v);save();app()}function del(i){if(confirm('Να διαγραφεί το προϊόν;')){d.splice(i,1);save();app()}}app();</script></body></html>
