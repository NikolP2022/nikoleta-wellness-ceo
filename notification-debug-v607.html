<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notification Test</title><style>body{font-family:Arial;background:#f7f2e8;padding:18px;color:#24352d}.box{max-width:620px;margin:auto;background:#fff;padding:22px;border-radius:20px;box-shadow:0 5px 20px #0001}h1{color:#245b2b}button{background:#245b2b;color:white;border:0;padding:14px 18px;border-radius:12px;font-weight:bold;font-size:16px;width:100%}#log{white-space:pre-wrap;background:#f1eadc;padding:14px;border-radius:12px;margin-top:15px;min-height:120px}.ok{color:#245b2b}.bad{color:#a33}</style></head><body><div class="box"><h1>🔔 Nikoleta Wellness CEO</h1><p>Έλεγχος ειδοποιήσεων</p><button id="go">Ενεργοποίηση ειδοποιήσεων</button><div id="log">Πάτησε το κουμπί.</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script><script>
const U='https://vbkuvexyqehmpeeejqbh.supabase.co',K='sb_publishable__nczNPWr3do_hqi6MCS0AQ_fjYCXhGk';const log=document.getElementById('log');const L=x=>log.textContent+=('\n'+x);const B=s=>{let x=s.replace(/-/g,'+').replace(/_/g,'/');while(x.length%4)x+='=';let b=atob(x),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a};
go.onclick=async()=>{log.textContent='Έλεγχος…';try{if(!window.supabase?.createClient)throw Error('Supabase library δεν φορτώθηκε');const sb=supabase.createClient(U,K);let ses=(await sb.auth.getSession()).data.session;if(!ses?.access_token)throw Error('Δεν υπάρχει ενεργή σύνδεση στον λογαριασμό.');L('✓ Σύνδεση: '+(ses.user.email||'OK'));if(!('Notification'in window))throw Error('Notification API δεν υποστηρίζεται');let p=await Notification.requestPermission();L('Άδεια: '+p);if(p!=='granted')throw Error('Η άδεια ειδοποιήσεων είναι '+p);let reg=await navigator.serviceWorker.register('./sw-v602.js',{scope:'./',updateViaCache:'none'});await reg.update();let ready=await navigator.serviceWorker.ready;L('✓ Service Worker');let r=await fetch(U+'/functions/v1/register-push',{method:'POST',headers:{'Content-Type':'application/json','apikey':K,'Authorization':'Bearer '+ses.access_token},body:'{}'});let t=await r.text();L('register-push HTTP '+r.status);L(t);let d=JSON.parse(t);if(!r.ok||d.error)throw Error(d.error||'register-push failed');if(!d.publicKey)throw Error('Δεν επιστράφηκε VAPID public key');let sub=await ready.pushManager.getSubscription();if(!sub)sub=await ready.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:B(d.publicKey)});let j=sub.toJSON();L('✓ Push subscription');let r2=await fetch(U+'/functions/v1/register-push',{method:'POST',headers:{'Content-Type':'application/json','apikey':K,'Authorization':'Bearer '+ses.access_token},body:JSON.stringify({endpoint:j.endpoint,keys:j.keys})});let t2=await r2.text();L('save subscription HTTP '+r2.status);L(t2);if(!r2.ok)throw Error(t2);L('\n✅ ΟΛΟΚΛΗΡΩΘΗΚΕ');}catch(e){L('\n❌ '+(e.message||e));}};
</script></body></html>
