<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Αποθήκη | Nikoleta Wellness CEO</title><style>body{margin:0;background:#eef1eb;color:#304b37;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:16px}.hero,.bar,.card,.stats>div{background:#fffdf8;border:1px solid #e6ddc8;border-radius:22px;box-shadow:0 8px 25px #0001}.hero{background:linear-gradient(135deg,#1f5b2a,#477b4c);color:white;padding:25px}.hero h1{margin:10px 0 4px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stats>div{padding:15px}.stats b{display:block;font-size:24px;color:#245b2b;margin-top:5px}.bar{padding:18px;display:flex;justify-content:space-between;align-items:center}.btn{background:#245b2b;color:white;border:0;border-radius:13px;padding:14px 20px;font-weight:bold;cursor:pointer;touch-action:manipulation}.filters{display:grid;grid-template-columns:1fr 230px;gap:10px;margin:12px 0}input,select,textarea{box-sizing:border-box;width:100%;padding:13px;border:1px solid #d8d0bb;border-radius:12px;background:#fffefa;font:inherit}.card{padding:17px;margin:10px 0}.name{font-size:20px;font-weight:bold;color:#245b2b}.details{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.detail{background:#f6f3eb;border-radius:11px;padding:9px}.detail small{display:block;color:#78827a}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button,.cancel{border:1px solid #d8d0bb;background:white;border-radius:10px;padding:9px 12px;font-weight:bold;touch-action:manipulation}.modal{position:fixed;z-index:99999;inset:0;background:#17251bd9;display:flex;align-items:center;justify-content:center;padding:10px}.form{background:#fffdf8;width:min(760px,100%);max-height:96vh;overflow:auto;border-radius:22px}.head{background:linear-gradient(135deg,#245b2b,#477b4c);color:white;padding:18px;display:flex;justify-content:space-between;align-items:center}.close{width:44px;height:44px;border:0;border-radius:50%;background:#fff3;color:white;font-size:28px;touch-action:manipulation}.body{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}.full{grid-column:1/-1}.foot{padding:0 18px 18px;display:flex;gap:10px;justify-content:flex-end}.toast{position:fixed;z-index:100000;bottom:20px;right:20px;background:#245b2b;color:white;padding:13px 17px;border-radius:13px;font-weight:bold}@media(max-width:700px){.wrap{padding:10px}.stats{grid-template-columns:1fr 1fr}.bar{display:block}.bar .btn{width:100%;margin-top:12px}.filters,.grid{grid-template-columns:1fr}.details{grid-template-columns:1fr 1fr}.full{grid-column:auto}.modal{align-items:flex-start}.form{max-height:calc(100vh - 20px)}.foot{flex-direction:column}.foot button{width:100%;min-height:48px}}
</style></head><body><main class="wrap"><section class="hero"><small>👑 CEO BUSINESS • PRODUCT CARE</small><h1>📦 Αποθήκη</h1><div>Οργάνωσε τα προϊόντα σου και παρακολούθησε το απόθεμα.</div></section><div id="app"></div></main><script>
const KEY='nwceo_inventory_mobile_v310';let data=[];try{data=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}if(!Array.isArray(data))data=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
function draw(){document.getElementById('app').innerHTML=`<section class="stats"><div>📦<b>${data.length}</b>Προϊόντα</div><div>🔢<b>${data.reduce((a,x)=>a+(+x.q||0),0)}</b>Τεμάχια</div><div>⚠️<b>${data.filter(x=>(+x.q||0)<=(+x.m||0)).length}</b>Χαμηλό απόθεμα</div><div>💰<b>${data.reduce((a,x)=>a+(+x.q||0)*(+x.c||0),0).toFixed(2)} €</b>Αξία</div></section><section class="bar"><div><h2>Το απόθεμά μου</h2><div>Πλήρης εικόνα για κάθε προϊόν.</div></div><button id="newBtn" class="btn" type="button">＋ Νέο προϊόν</button></section><section class="filters"><input id="search" placeholder="🔎 Αναζήτηση προϊόντος, κατηγορίας ή προμηθευτή"><select id="filter"><option value="all">Όλα τα προϊόντα</option><option value="low">⚠️ Χαμηλό απόθεμα</option><option value="ok">✓ Διαθέσιμα</option></select></section><section id="list"></section>`;document.getElementById('newBtn').addEventListener('click',()=>openForm());document.getElementById('search').addEventListener('input',list);document.getElementById('filter').addEventListener('change',list);list()}
function list(){let q=(document.getElementById('search')?.value||'').toLowerCase(),f=document.getElementById('filter')?.value||'all';let arr=data.map((x,i)=>({x,i})).filter(o=>`${o.x.n} ${o.x.cat} ${o.x.sup}`.toLowerCase().includes(q));if(f==='low')arr=arr.filter(o=>(+o.x.q||0)<=(+o.x.m||0));if(f==='ok')arr=arr.filter(o=>(+o.x.q||0)>(+o.x.m||0));document.getElementById('list').innerHTML=arr.length?arr.map(o=>`<article class="card"><div class="name">${esc(o.x.n)}</div><div>${esc(o.x.cat||'Χωρίς κατηγορία')}${o.x.sup?' • '+esc(o.x.sup):''}</div><div class="details"><div class="detail"><small>Τεμάχια</small><b>${+o.x.q||0}</b></div><div class="detail"><small>Ελάχιστο</small><b>${+o.x.m||0}</b></div><div class="detail"><small>Κόστος</small><b>${(+o.x.c||0).toFixed(2)} €</b></div><div class="detail"><small>Πώληση</small><b>${(+o.x.p||0).toFixed(2)} €</b></div><div class="detail"><small>Λήξη</small><b>${o.x.ex||'—'}</b></div></div><div class="actions"><button type="button" data-a="minus" data-i="${o.i}">− 1</button><button type="button" data-a="plus" data-i="${o.i}">＋ 1</button><button type="button" data-a="edit" data-i="${o.i}">✏️ Επεξεργασία</button><button type="button" data-a="del" data-i="${o.i}">🗑️ Διαγραφή</button></div></article>`).join(''):'<div class="card" style="text-align:center;padding:40px">📦 Δεν υπάρχουν προϊόντα ακόμη.</div>';document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{let i=+b.dataset.i,a=b.dataset.a;if(a==='minus'){data[i].q=Math.max(0,(+data[i].q||0)-1);save();draw()}if(a==='plus'){data[i].q=(+data[i].q||0)+1;save();draw()}if(a==='edit')openForm(i);if(a==='del'&&confirm('Να διαγραφεί το προϊόν;')){data.splice(i,1);save();draw()}}))}
function openForm(i=null){document.querySelector('.modal')?.remove();let x=i===null?{}:data[i],m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="form"><div class="head"><div><small>PRODUCT CARE • CEO BUSINESS</small><h2>${i===null?'📦 Νέο προϊόν':'✏️ Επεξεργασία προϊόντος'}</h2></div><button class="close" id="x" type="button">×</button></div><form id="f"><div class="body"><div class="grid"><div class="field"><label>📦 Προϊόν *</label><input name="n" required value="${esc(x.n)}" placeholder="π.χ. Formula 1"></div><div class="field"><label>🏷️ Κατηγορία</label><input name="cat" value="${esc(x.cat)}"></div><div class="field"><label>🔢 Ποσότητα *</label><input name="q" type="number" min="0" required value="${x.q??0}"></div><div class="field"><label>⚠️ Ελάχιστο απόθεμα</label><input name="m" type="number" min="0" value="${x.m??3}"></div><div class="field"><label>💰 Κόστος αγοράς (€)</label><input name="c" type="number" step="0.01" value="${x.c??0}"></div><div class="field"><label>🏷️ Τιμή πώλησης (€)</label><input name="p" type="number" step="0.01" value="${x.p??0}"></div><div class="field"><label>🚚 Προμηθευτής</label><input name="sup" value="${esc(x.sup)}"></div><div class="field"><label>📅 Ημερομηνία λήξης</label><input name="ex" type="date" value="${esc(x.ex)}"></div><div class="field"><label>📍 Θέση αποθήκευσης</label><input name="loc" value="${esc(x.loc)}"></div><div class="field full"><label>📝 Σημειώσεις</label><textarea name="note">${esc(x.note)}</textarea></div></div></div><div class="foot"><button class="cancel" id="cancel" type="button">Ακύρωση</button><button class="btn" type="submit">💾 Αποθήκευση προϊόντος</button></div></form></div>`;document.body.appendChild(m);const close=()=>m.remove();document.getElementById('x').addEventListener('click',close);document.getElementById('cancel').addEventListener('click',close);document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();let g=n=>e.currentTarget.elements[n].value.trim(),o={n:g('n'),cat:g('cat'),q:+g('q')||0,m:+g('m')||0,c:+g('c')||0,p:+g('p')||0,sup:g('sup'),ex:g('ex'),loc:g('loc'),note:g('note')};if(!o.n)return;if(i===null)data.unshift(o);else data[i]=o;save();close();draw();let t=document.createElement('div');t.className='toast';t.textContent='✓ Η αποθήκευση ολοκληρώθηκε';document.body.appendChild(t);setTimeout(()=>t.remove(),1800)});setTimeout(()=>m.querySelector('input[name=n]')?.focus(),100)}draw();
</script></body></html>
