<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3f7d45">
<meta name="description" content="Nikoleta Wellness CEO — CRM, Tanita, Planner και Οικονομικά">
<title>Nikoleta Wellness CEO</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="brand"><div class="leaf">🌿</div><div><b>Nikoleta</b><span>Wellness CEO</span></div></div>
  <button id="addClientTop" class="primary">＋ Νέος πελάτης</button>
</header>
<nav>
  <button data-view="dashboard" class="active">Αρχική</button>
  <button data-view="clients">Πελάτες</button>
  <button data-view="tanita">Tanita</button>
  <button data-view="planner">Planner</button>
  <button data-view="finance">Οικονομικά</button>
  <button data-view="backup">Αντίγραφο</button>
</nav>
<main id="app"></main>

<dialog id="clientDialog">
<form method="dialog" id="clientForm">
<h2>Νέος πελάτης</h2>
<input name="name" placeholder="Ονοματεπώνυμο" required>
<input name="phone" placeholder="Τηλέφωνο">
<input name="email" type="email" placeholder="Email">
<input name="nextFollowUp" type="date" aria-label="Επόμενο follow-up">
<textarea name="notes" placeholder="Σημειώσεις"></textarea>
<div class="actions"><button value="cancel">Ακύρωση</button><button class="primary" value="ok">Αποθήκευση</button></div>
</form>
</dialog>

<script src="app.js"></script>
</body>
</html>
