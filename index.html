<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#245b2b">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Nikoleta Wellness CEO — Wellness Touch Point</title>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
  <script src="./app-v602.js?v=709"></script>
  <script src="./appointment-direct-v613.js?v=709"></script>
  <script src="./notification-settings-fix-v615.js?v=709"></script>
  <script src="./notification-fix-v606.js?v=709"></script>
  <script src="./reminder-sound-v614.js?v=709"></script>
  <link rel="stylesheet" href="./mobile-refresh-v1.css?v=709">
  <style>
  @media screen and (max-width:1200px){
    html,body{width:100%!important;min-width:0!important;max-width:100%!important;overflow-x:hidden!important;margin:0!important;padding:0!important}
    #app{width:100%!important;min-width:0!important;max-width:100%!important;margin:0!important;padding:0!important;overflow-x:hidden!important;zoom:1!important}
    #app .drawer{left:-110vw!important;right:auto!important;transform:none!important;visibility:hidden!important;pointer-events:none!important}
    #app .drawer.open{left:0!important;visibility:visible!important;pointer-events:auto!important}
  }
  </style>
  <link rel="stylesheet" href="./mobile-final-v708.css?v=709">
  <style>
    #greece-clock{font-family:Arial,sans-serif;display:flex;align-items:center;gap:5px}
    @media(max-width:600px){#greece-clock{font-size:15px!important}#greece-clock span{display:none}}
  </style>
  <script>
  (()=>{'use strict';
    const TZ='Europe/Athens';
    const greekTime=()=>new Intl.DateTimeFormat('el-GR',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());
    function hideHomeEmail(){
      const email=window.__appUserEmail||''; if(!email)return;
      const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT); const nodes=[]; let n;
      while(n=walker.nextNode()) if(n.nodeValue&&n.nodeValue.trim().toLowerCase()===email.toLowerCase()) nodes.push(n);
      nodes.forEach(t=>{const el=t.parentElement;if(el&&!['INPUT','TEXTAREA'].includes(el.tagName))el.style.display='none'});
    }
    function update(){
      try{if(window.user&&window.user.email)window.__appUserEmail=window.user.email}catch(e){}
      const top=document.querySelector('.top'); if(!top)return;
      let el=document.getElementById('greece-clock');
      if(!el){el=document.createElement('div');el.id='greece-clock';el.setAttribute('aria-label','Ώρα Ελλάδας');const menu=top.querySelector('.menu');top.insertBefore(el,menu||null)}
      el.innerHTML='🇬🇷 <span>Ώρα Ελλάδας</span> <b>'+greekTime()+'</b>';
      hideHomeEmail();
    }
    setInterval(update,1000); new MutationObserver(update).observe(document.body,{subtree:true,childList:true}); setTimeout(update,300); setTimeout(update,1200);
  })();
  </script>
</body>
</html>
