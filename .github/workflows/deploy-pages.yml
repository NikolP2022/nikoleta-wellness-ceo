name: Deploy Nikoleta Wellness CEO to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Syntax check new modules
        run: |
          node --check modules-v234.js
          node --check modules-v235.js
          node --check sw-v234.js
          node --check completion-v230.js
      - name: Syntax check planner app script
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("agenda.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\\b(?![^>]*\\bsrc=)[^>]*>(.*?)</script\\s*>", html, re.I | re.S)
          if not scripts:
              raise SystemExit("No inline script found in agenda.html")
          Path("/tmp/agenda-inline.js").write_text("\\n;\\n".join(scripts), encoding="utf-8")
          print(f"Extracted {len(scripts)} inline script block(s)")
          PY
          node --check /tmp/agenda-inline.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
